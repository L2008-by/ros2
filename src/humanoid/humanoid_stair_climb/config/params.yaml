# humanoid_stair_climb 参数文件
#
# 节点名分节约定与仓库其它 ROS 2 功能包一致。

/stair_climb_node:
  ros__parameters:
    control_hz: 50.0        # 控制频率
    time_limit: 12.0        # 仿真时长上限，秒
    cycle_time: 1.4         # 一个完整步态周期
    swing_ratio: 0.42       # 单腿摆动相占比
    lift_height: 0.05       # 摆动相相对落点台阶面的抬腿余量
    scene: ""               # 留空使用包内 models/stair_scene.xml
